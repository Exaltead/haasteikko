name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  API_URL: "https://haasteikko.eu/api"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.x"
          cache: npm

      - name: Install dependencies
        run: |
          npm ci

      - name: Build frontend
        env:
          VITE_API_URL: ${{ env.API_URL }}
          VITE_CLIENT_ID: ${{ secrets.CLIENT_ID }}
        run: |
          npm run build --workspace=frontend

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo registry and index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Build rust backend
        run: |
          cd packages/backend
          # Clean target directory to avoid cache issues
          cargo clean
          cargo build --release --target x86_64-unknown-linux-gnu
          # Verify the binary was built
          echo "Checking for binary..."
          echo "Current directory: $(pwd)"
          echo "Looking for binary in: ../../target/x86_64-unknown-linux-gnu/release/"
          if [ -f "../../target/x86_64-unknown-linux-gnu/release/haasteikko-backend" ]; then
            ls -la ../../target/x86_64-unknown-linux-gnu/release/
          else
            echo "ERROR: Binary not found in expected location!"
            echo "Searching for binary..."
            find ../../ -name "haasteikko-backend" -type f 2>/dev/null || true
            exit 1
          fi

      - name: Prepare deployment artifacts
        run: |
          rm -rf deployment_artifacts || true
          mkdir -p deployment_artifacts/dist
          cp -r packages/frontend/dist/* deployment_artifacts/dist/
          mkdir -p deployment_artifacts/backend
          # copy the built binary
          if [ -f "target/x86_64-unknown-linux-gnu/release/haasteikko-backend" ]; then
            cp target/x86_64-unknown-linux-gnu/release/haasteikko-backend deployment_artifacts/backend/
          else
            echo "ERROR: Backend binary not found!"
            ls -la target/x86_64-unknown-linux-gnu/release/ || true
            find . -name "haasteikko-backend" -type f 2>/dev/null || true
            exit 1
          fi
          # copy migrations
          cp -r packages/backend/migrations deployment_artifacts/backend/

      - name: Create SSH key
        env:
          VM_SSH_SECRET: ${{ secrets.VM_SSH_SECRET }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$VM_SSH_SECRET" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts || true

      - name: Verify deployment artifacts
        run: |
          echo "Checking deployment artifacts..."
          ls -la deployment_artifacts/
          ls -la deployment_artifacts/backend/
          if [ ! -f "deployment_artifacts/backend/haasteikko-backend" ]; then
            echo "ERROR: Backend binary missing from deployment artifacts!"
            exit 1
          fi

      - name: Deploy
        env:
          VM_USER: ${{ secrets.VM_USER }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          rsync -r deployment_artifacts/dist "$VM_USER@$VM_HOST:/home"
          rsync -r deployment_artifacts/backend/migrations "$VM_USER@$VM_HOST:/opt/haasteikko"
          rsync deployment_artifacts/backend/haasteikko-backend "$VM_USER@$VM_HOST:/opt/haasteikko"
          ssh -i ~/.ssh/id_ed25519 "$VM_USER@$VM_HOST" "sudo systemctl restart haasteikko-backend"
